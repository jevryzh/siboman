<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 套图服务 · 控制台</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #0f172a; color: #e2e8f0; }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 26px 20px 60px; }
    h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: .5px; }
    .sub { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
    .card h2 { font-size: 15px; margin: 0 0 14px; color: #f1f5f9; }
    label { display: block; font-size: 12px; color: #94a3b8; margin: 10px 0 5px; }
    input, select, textarea { width: 100%; background: #0f172a; border: 1px solid #334155; color: #e2e8f0;
      border-radius: 8px; padding: 9px 11px; font-size: 13px; font-family: inherit; }
    input:focus, select:focus { outline: none; border-color: #3b82f6; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    .row > div { flex: 1; min-width: 180px; }
    button { background: #2563eb; border: none; color: #fff; padding: 10px 18px; border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #475569; cursor: not-allowed; }
    button.ghost { background: transparent; border: 1px solid #475569; color: #cbd5e1; }
    .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; background: #14532d; color: #86efac; }
    .pill.bad { background: #7f1d1d; color: #fca5a5; }
    .keys { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 6px; }
    .keys label { display: flex; align-items: center; gap: 7px; margin: 0; color: #cbd5e1; font-size: 13px;
      background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 8px 10px; cursor: pointer; }
    .keys input { width: auto; }
    .job { border: 1px solid #334155; border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; background: #0f172a; }
    .job-head { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; flex-wrap: wrap; }
    .mono { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #94a3b8; word-break: break-all; }
    .thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .thumbs img, .thumbs .ph { width: 78px; height: 104px; object-fit: cover; border-radius: 6px; background: #1e293b; }
    .log { font-size: 12px; color: #94a3b8; margin-top: 10px; white-space: pre-wrap; }
    .err { color: #fca5a5; font-size: 13px; margin-top: 10px; }
    a { color: #60a5fa; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>AI 套图服务 · 控制台</h1>
    <div class="sub">给 Ozon / Etsy / Yandex 生成 3:4（Etsy 1:1）套图 · 用 ERP 账号登录后使用</div>

    <!-- 未登录 -->
    <div class="card" id="loginCard" style="display:none">
      <h2>请登录（ERP 账号密码）</h2>
      <div class="row">
        <div><label>账号</label><input id="lgUser" autocomplete="username" /></div>
        <div><label>密码</label><input id="lgPass" type="password" autocomplete="current-password" /></div>
      </div>
      <div style="margin-top:14px"><button id="lgBtn">登录</button></div>
      <div class="err" id="lgErr"></div>
    </div>

    <div id="appArea" style="display:none">
      <div class="card">
        <h2>服务状态 <span class="pill" id="hPill">检测中…</span></h2>
        <div class="mono" id="hInfo"></div>
        <div style="margin-top:12px">
          <button class="ghost" id="refreshBtn">刷新任务列表</button>
          <button class="ghost" id="logoutBtn" style="margin-left:8px">退出登录</button>
        </div>
      </div>

      <div class="card">
        <h2>新建套图任务</h2>
        <div class="row">
          <div>
            <label>平台</label>
            <select id="fPlatform">
              <option value="ozon">Ozon（3:4 俄文 7 图）</option>
              <option value="yandex">Yandex（3:4 俄文 7 图）</option>
              <option value="etsy">Etsy（1:1 英文 7 图）</option>
            </select>
          </div>
          <div><label>标题（可选，影响文案）</label><input id="fTitle" placeholder="商品标题" /></div>
        </div>
        <label>参考图（最多 <span id="refMax">4</span> 张）：可拖拽多张 / Ctrl+V 粘贴 / 点击选择文件，也可以直接粘图片链接</label>
        <div id="drop" style="border:1.5px dashed #475569; border-radius:10px; padding:16px; text-align:center; cursor:pointer; transition:.15s">
          <div id="dropHint" style="color:#94a3b8; font-size:13px">把商品图拖到这里（支持多张）· 或 Ctrl+V 粘贴 · 或点击选择文件</div>
          <input id="fFile" type="file" accept="image/*" multiple style="display:none" />
          <div id="refList" style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:12px"></div>
        </div>
        <div class="row" style="margin-top:10px">
          <div style="flex:3"><input id="fRefUrl" placeholder="粘贴图片链接后点「添加链接」" /></div>
          <div style="flex:0 0 auto"><button class="ghost" id="addUrlBtn" type="button">添加链接</button></div>
          <div style="flex:0 0 auto"><button class="ghost" id="clearRefsBtn" type="button">清空参考图</button></div>
        </div>
        <label>要生成的图片（默认 7 张全生成；取消勾选可少生成几张省钱）
          <span style="float:right">
            <a href="javascript:void(0)" id="keysAll">全选</a> ·
            <a href="javascript:void(0)" id="keysNone">全不选</a>
          </span>
        </label>
        <div class="keys" id="keysBox"></div>
        <div class="mono" id="keysHint" style="margin-top:8px"></div>
        <div style="margin-top:16px"><button id="submitBtn">开始出图</button>
          <span class="mono" id="submitHint" style="margin-left:12px"></span></div>
        <div id="live" style="display:none; margin-top:16px; border:1px solid #334155; border-radius:10px; padding:14px; background:#0b1220">
          <div style="display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; font-size:13px">
            <b id="liveTitle">当前任务</b>
            <span id="liveStatus" class="mono"></span>
          </div>
          <div style="margin-top:10px; height:8px; background:#1e293b; border-radius:99px; overflow:hidden">
            <div id="liveBar" style="height:100%; width:0%; background:#2563eb; transition:.4s"></div>
          </div>
          <div class="mono" id="livePhase" style="margin-top:8px"></div>
          <div class="thumbs" id="liveThumbs"></div>
          <div style="margin-top:12px"><button class="ghost" id="liveCancel">取消这个任务</button></div>
        </div>
        <div class="err" id="fErr"></div>
      </div>

      <div class="card">
        <h2>任务列表</h2>
        <div id="jobs"></div>
      </div>
    </div>
  </div>

<script>
const KEYS = [
  ['main', '主图'], ['usage', '使用场景'], ['multi', '多件摆拍'], ['features', '产品特点'],
  ['comparison', '竞品对比'], ['single', '单件摆拍'], ['details', '多角度细节'],
];
const BASE = '/api/image-set';

async function api(path, opts) {
  const res = await fetch(BASE + path, { credentials: 'include', headers: { 'Content-Type': 'application/json' }, ...(opts || {}) });
  const text = await res.text();
  let data = null;
  try { data = JSON.parse(text); } catch { data = { ok: false, error: '响应不是 JSON（可能未登录）：' + text.slice(0, 120) }; }
  return { status: res.status, data };
}

function el(id) { return document.getElementById(id); }

// ===== 参考图：多张上传（拖拽 / 粘贴 / 选择 / 链接），可逐张删除 =====
const MAX_REFS = 4;
let refs = [];   // [{ url, label }]
let uploadSeq = 0;

function renderRefs() {
  el('refMax').textContent = MAX_REFS;
  el('refList').innerHTML = refs.map((r, i) => `
    <div style="position:relative">
      <img src="${r.url}" style="width:86px; height:114px; object-fit:cover; border-radius:8px; border:1px solid #334155" />
      <button data-delref="${i}" title="删除这张参考图"
        style="position:absolute; top:-7px; right:-7px; width:20px; height:20px; padding:0; line-height:18px; border-radius:50%; background:#dc2626; color:#fff; border:none; cursor:pointer; font-size:13px">×</button>
      <div class="mono" style="max-width:86px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">${r.label || ''}</div>
    </div>`).join('');
  el('refList').querySelectorAll('[data-delref]').forEach(btn => btn.addEventListener('click', (e) => {
    e.stopPropagation();
    refs.splice(Number(btn.dataset.delref), 1);
    renderRefs();
  }));
  const n = refs.length;
  const uploading = refs.filter(r => r.uploading).length;
  if (uploading) el('dropHint').textContent = `已选 ${n}/${MAX_REFS} 张，其中 ${uploading} 张上传中…`;
  else if (n === 0) el('dropHint').textContent = '把商品图拖到这里（支持多张）· 或 Ctrl+V 粘贴 · 或点击选择文件';
  else el('dropHint').textContent = `已选 ${n}/${MAX_REFS} 张参考图${n >= MAX_REFS ? '（已达上限）' : '，可继续添加或点 × 删除'}`;
}

function addRefUrl(url, label) {
  const u = String(url || '').trim();
  if (!u) return;
  if (refs.length >= MAX_REFS) { el('fErr').textContent = `最多 ${MAX_REFS} 张参考图`; return; }
  if (refs.some(r => r.url === u)) return;
  refs.push({ url: u, label: label || '' });
  renderRefs();
}

async function uploadRefFiles(fileList) {
  const files = Array.from(fileList || []).filter(f => /^image\//.test(f.type || ''));
  if (!files.length) { el('fErr').textContent = '没识别到图片文件（支持 JPG / PNG / WEBP / GIF）'; return; }
  el('fErr').textContent = '';
  const room = MAX_REFS - refs.length;
  if (room <= 0) { el('fErr').textContent = `最多 ${MAX_REFS} 张参考图`; return; }
  const accepted = files.slice(0, room);
  if (files.length > room) el('fErr').textContent = `最多 ${MAX_REFS} 张参考图，多出的 ${files.length - room} 张已忽略`;

  // 先全部占位并立刻显示，再并发上传（串行上传多张会很慢）
  const tasks = [];
  for (const file of accepted) {
    if (file.size > 30 * 1024 * 1024) { el('fErr').textContent = `「${file.name}」超过 30MB，已跳过`; continue; }
    const tempUrl = URL.createObjectURL(file);
    const slot = { url: tempUrl, label: '上传中…', uploading: true };
    refs.push(slot);
    tasks.push({ file, slot, tempUrl });
  }
  renderRefs();
  const n = tasks.length;
  el('dropHint').textContent = `正在上传 ${n} 张参考图…`;

  await Promise.all(tasks.map(async ({ file, slot, tempUrl }) => {
    try {
      const res = await fetch('/api/image-set/upload', {
        method: 'POST', credentials: 'include',
        headers: { 'Content-Type': file.type || 'application/octet-stream' },
        body: file,
      });
      const text = await res.text();
      let d = null;
      try { d = JSON.parse(text); } catch { d = null; }
      if (!res.ok || !d || !d.ok) throw new Error((d && d.error) || ('上传失败 HTTP ' + res.status));
      slot.url = d.url;
      slot.label = `${(d.bytes / 1024).toFixed(0)}KB`;
      slot.uploading = false;
    } catch (e) {
      refs = refs.filter(r => r !== slot);
      el('fErr').textContent = `参考图上传失败：${e.message || e}`;
    }
  }));
  renderRefs();
}

function pickImageFiles(dt) {
  if (!dt) return [];
  const out = [];
  if (dt.files && dt.files.length) out.push(...Array.from(dt.files).filter(x => /^image\//.test(x.type || '')));
  if (!out.length && dt.items) {
    for (const it of Array.from(dt.items)) {
      if (it.kind === 'file' && /^image\//.test(it.type || '')) { const f = it.getAsFile(); if (f) out.push(f); }
    }
  }
  return out;
}

function initRefDropzone() {
  const drop = el('drop');
  const file = el('fFile');
  drop.addEventListener('click', (e) => { if (e.target.closest('[data-delref]')) return; file.click(); });
  file.addEventListener('change', () => { uploadRefFiles(file.files); file.value = ''; });

  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, (e) => {
    e.preventDefault(); drop.style.borderColor = '#3b82f6'; drop.style.background = 'rgba(59,130,246,.08)';
  }));
  ['dragleave', 'dragend'].forEach(ev => drop.addEventListener(ev, () => {
    drop.style.borderColor = '#475569'; drop.style.background = 'transparent';
  }));
  drop.addEventListener('drop', (e) => {
    e.preventDefault(); drop.style.borderColor = '#475569'; drop.style.background = 'transparent';
    const files = pickImageFiles(e.dataTransfer);
    if (files.length) { uploadRefFiles(files); return; }
    const t = (e.dataTransfer?.getData?.('text') || '').trim();
    if (/^https?:\/\//.test(t)) addRefUrl(t, '来自链接');
    else el('fErr').textContent = '没识别到图片，请拖拽图片文件';
  });

  // 整页粘贴：截图/复制的图片，或图片链接
  document.addEventListener('paste', (e) => {
    if (el('appArea').style.display === 'none') return;
    const files = pickImageFiles(e.clipboardData);
    if (files.length) { e.preventDefault(); uploadRefFiles(files); return; }
    const t = (e.clipboardData?.getData?.('text') || '').trim();
    if (/^https?:\/\/\S+$/.test(t)) addRefUrl(t, '来自链接');
  });

  el('addUrlBtn').addEventListener('click', () => { addRefUrl(el('fRefUrl').value, '来自链接'); el('fRefUrl').value = ''; });
  el('fRefUrl').addEventListener('keydown', (e) => { if (e.key === 'Enter') { addRefUrl(el('fRefUrl').value, '来自链接'); el('fRefUrl').value = ''; } });
  el('clearRefsBtn').addEventListener('click', () => { refs = []; renderRefs(); });
  renderRefs();
}

const STATUS_ZH = { queued: '排队中', running: '生成中', done: '已完成', error: '失败', canceled: '已取消' };
const statusZh = (s) => STATUS_ZH[s] || s || '';

function selectedKeys() {
  return Array.from(document.querySelectorAll('#keysBox input:checked')).map(x => x.value);
}
function updateKeysHint() {
  const n = selectedKeys().length;
  el('keysHint').textContent = n === 0
    ? '⚠ 一张都没勾：这样不会生成任何图，请至少勾一张'
    : `本次将生成 ${n} 张（预计 ${Math.max(1, Math.round(n * 1.1))} 分钟左右，一张约 60 秒）`;
}
function setAllKeys(checked) {
  document.querySelectorAll('#keysBox input').forEach(x => { x.checked = checked; });
  updateKeysHint();
}
function renderKeys() {
  el('keysBox').innerHTML = KEYS.map(([k, zh]) =>
    `<label><input type="checkbox" value="${k}" checked />${zh}</label>`).join('');
  document.querySelectorAll('#keysBox input').forEach(x => x.addEventListener('change', updateKeysHint));
  el('keysAll').addEventListener('click', () => setAllKeys(true));
  el('keysNone').addEventListener('click', () => setAllKeys(false));
  updateKeysHint();
}

async function checkAuth() {
  const res = await fetch('/api/auth/status', { credentials: 'include' });
  const d = await res.json().catch(() => ({}));
  const ok = Boolean(d.authenticated);
  el('loginCard').style.display = ok ? 'none' : 'block';
  el('appArea').style.display = ok ? 'block' : 'none';
  if (ok) { refreshHealth(); refreshJobs(); }
}

async function login() {
  el('lgErr').textContent = '';
  const username = el('lgUser').value.trim();
  const password = el('lgPass').value;
  const res = await fetch('/api/auth/login', {
    method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password }),
  });
  const d = await res.json().catch(() => ({}));
  if (!res.ok || !d.success) { el('lgErr').textContent = d.error || '登录失败'; return; }
  await checkAuth();
}

async function refreshHealth() {
  const { data } = await api('/health');
  const ok = data && data.ok;
  el('hPill').textContent = ok ? '正常' : '异常';
  el('hPill').className = 'pill' + (ok ? '' : ' bad');
  el('hInfo').textContent = ok
    ? `模型 ${data.model} · 入口 ${data.base} · 支持平台 ${(data.platforms || []).join(' / ')} · 历史任务 ${data.jobs}`
    : (data && data.error) || '无法连接出图服务';
}

async function submitJob() {
  el('fErr').textContent = '';
  const refUrls = refs.filter(r => /^https?:\/\//.test(r.url)).map(r => r.url);
  if (!refUrls.length) {
    el('fErr').textContent = refs.length ? '参考图还在上传中，请稍等一秒再点开始' : '请先添加至少一张参考图（拖拽 / 粘贴 / 选择文件 / 贴链接）';
    return;
  }
  const keys = selectedKeys();
  if (!keys.length) { el('fErr').textContent = '请至少勾选一张要生成的图片（或点「全选」生成 7 张）'; return; }
  const body = {
    platform: el('fPlatform').value,
    refImageUrl: refUrls[0],
    refImageUrls: refUrls,
    title: el('fTitle').value.trim(),
    keys: keys.length === KEYS.length ? null : keys,
  };
  el('submitBtn').disabled = true;
  el('submitHint').textContent = '提交中…';
  try {
    const { data } = await api('/jobs', { method: 'POST', body: JSON.stringify(body) });
    if (!data || !data.ok) { el('fErr').textContent = (data && data.error) || '提交失败'; el('submitHint').textContent = ''; return; }
    el('submitHint').textContent = '任务号 ' + data.jobId;
    watchJob(data.jobId, body.platform, keys.length);
    refreshJobs();
  } catch (e) {
    el('fErr').textContent = '提交失败：' + (e.message || e) + '（若长时间无反应，请刷新页面重新登录）';
  } finally {
    el('submitBtn').disabled = false;   // 无论如何都要恢复，否则按钮会永久点不动
  }
}

// ===== 当前任务面板：提交后立刻盯住它，不用去列表里找 =====
let liveJobId = null;
function watchJob(jobId, platform, total) {
  liveJobId = jobId;
  el('live').style.display = 'block';
  el('liveTitle').textContent = `当前任务 · ${platform} · 计划 ${total} 张`;
  el('liveStatus').textContent = '';
  el('livePhase').textContent = '正在提交…';
  el('liveBar').style.width = '0%';
  el('liveThumbs').innerHTML = '';
}
function renderLive(job) {
  if (!liveJobId || !job) return;
  const imgs = job.images || [];
  const okImgs = imgs.filter(x => x.ok && x.url);
  const total = Number(job.total || 0);
  const done = Number(job.processed || okImgs.length || 0);
  el('liveStatus').textContent = statusZh(job.status) + (job.queuedAhead ? `（前面还有 ${job.queuedAhead} 个任务）` : '');
  el('livePhase').textContent = String(job.phase || '') + (total ? `　成功 ${okImgs.length}/${total}` : '') + (job.error ? `　${job.error}` : '');
  el('liveBar').style.width = total ? Math.round((done / total) * 100) + '%' : (job.status === 'running' ? '15%' : '0%');
  el('liveThumbs').innerHTML = imgs.map(x => x.ok && x.url
    ? `<a href="${x.url}" target="_blank" title="${x.label || x.key}"><img src="${x.url}" /></a>`
    : `<div class="ph" title="${String(x.error || '生成中').replace(/"/g, '')}"></div>`).join('');
  if (['done', 'error', 'canceled'].includes(job.status)) {
    el('liveBar').style.width = '100%';
    el('liveBar').style.background = job.status === 'done' ? '#16a34a' : '#dc2626';
  }
}

let timer = null;
async function refreshJobs() {
  const { data } = await api('/jobs');
  const list = (data && data.jobs) || [];
  if (liveJobId) {
    const mine = list.find(j => j.id === liveJobId);
    if (mine) renderLive(mine);
    else api('/jobs/' + encodeURIComponent(liveJobId)).then(({ data: d }) => d && d.job && renderLive(d.job)).catch(() => {});
  }
  if (!list.length) { el('jobs').innerHTML = '<div class="mono">还没有任务</div>'; return; }
  el('jobs').innerHTML = list.map(j => {
    const imgs = (j.images || []);
    const thumbs = imgs.map(x => x.ok && x.url
      ? `<a href="${x.url}" target="_blank"><img src="${x.url}" /></a>`
      : `<div class="ph" title="${(x.error || '').replace(/"/g, '')}"></div>`).join('');
    return `<div class="job">
      <div class="job-head">
        <div><b>${j.platform || ''}</b> · <span class="pill${j.status === 'done' ? '' : ' bad'}">${statusZh(j.status)}</span>
          <div class="mono">${j.id}</div></div>
        <div class="mono">${j.processed || 0}/${j.total || 0} · ${(j.phase || '').slice(0, 70)}</div>
        <div>${['queued','running'].includes(j.status) ? `<button class="ghost" data-cancel="${j.id}" style="padding:5px 12px; font-size:12px">取消任务</button>` : ''}</div>
      </div>
      <div class="thumbs">${thumbs}</div>
      <div class="log">${(j.refImageUrls || [j.refImageUrl]).filter(Boolean).length} 张参考图 · ${((j.refImageUrls || [j.refImageUrl]).filter(Boolean)[0] || '').slice(0, 120)}</div>
    </div>`;
  }).join('');
  el('jobs').querySelectorAll('[data-cancel]').forEach(btn => btn.addEventListener('click', async () => {
    const id = btn.dataset.cancel;
    btn.disabled = true; btn.textContent = '取消中…';
    try {
      const { data } = await api('/jobs/' + encodeURIComponent(id) + '/cancel', { method: 'POST' });
      if (data && data.ok) { if (liveJobId === id) el('livePhase').textContent = '已取消'; refreshJobs(); }
      else { btn.disabled = false; btn.textContent = '取消任务'; alert('取消失败：' + ((data && data.error) || '未知错误')); }
    } catch (e) { btn.disabled = false; btn.textContent = '取消任务'; alert('取消失败：' + (e.message || e)); }
  }));
}

el('lgBtn').addEventListener('click', login);
el('lgPass').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
el('submitBtn').addEventListener('click', submitJob);
el('liveCancel').addEventListener('click', async () => {
  if (!liveJobId) return;
  el('livePhase').textContent = '正在取消…';
  try {
    const { data } = await api('/jobs/' + encodeURIComponent(liveJobId) + '/cancel', { method: 'POST' });
    el('livePhase').textContent = (data && data.ok) ? '已取消' : ('取消失败：' + ((data && data.error) || '未知错误'));
  } catch (e) { el('livePhase').textContent = '取消失败：' + (e.message || e); }
  refreshJobs();
});
el('refreshBtn').addEventListener('click', () => { refreshHealth(); refreshJobs(); });
el('logoutBtn').addEventListener('click', async () => {
  await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' }).catch(() => {});
  checkAuth();
});
renderKeys();
initRefDropzone();
checkAuth();
timer = setInterval(() => { if (el('appArea').style.display !== 'none') refreshJobs(); }, 10000);

el('fPlatform').addEventListener('change', () => {
  const p = el('fPlatform').value;
  el('submitHint').textContent = p === 'etsy' ? 'Etsy：1:1 英文' : '3:4 俄文';
});
const qs = new URLSearchParams(location.search);
if (qs.get('ref')) addRefUrl(qs.get('ref'), '来自链接');
if (qs.get('platform')) el('fPlatform').value = qs.get('platform');
</script>
</body>
</html>
