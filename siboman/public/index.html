<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>逐梦 ERP 专业版</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
    <style>
      body { margin: 0; background: #f8fafc; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:#111827; }
      #app { height: 100vh; }
      .layout-container { height: 100vh; }
      .el-aside { background: #031626; color: #fff; box-shadow: inset -1px 0 0 rgba(255,255,255,.06); }
      .logo { height: 64px; line-height: 64px; text-align: center; font-size: 18px; font-weight: 800; background: #08233a; color: #38bdf8; letter-spacing:0; }
      .el-menu { border-right:0 !important; }
      .el-menu-item { height:54px; font-weight:700; font-size:14px; margin:4px 10px; border-radius:8px; color:#dbeafe !important; }
      .el-menu-item:hover { background:#0f2a44 !important; color:#fff !important; }
      .el-menu-item.is-active { background:#0b7bdc !important; color:#fff !important; }
      .el-header { height:64px; padding:0 24px; }
      .erp-app-header { background:#fff; border-bottom:1px solid #e5edf6; display:flex; align-items:center; justify-content:space-between; box-shadow:0 1px 0 rgba(15,23,42,.02); }
      .erp-main { padding:0; background:#f8fafc; overflow:auto; }
      .erp-route-page { min-height:100%; padding:28px 34px; background:#f8fafc; box-sizing:border-box; }
      .erp-route-page .el-card { border:1px solid #dfe7f1; border-radius:8px; box-shadow:none; background:#fff; overflow:hidden; }
      .erp-route-page .el-card__header { padding:16px 18px; border-bottom:1px solid #e5edf6; background:#fff; }
      .erp-route-page .el-card__body { padding:18px; }
      .erp-route-page .el-table { border-radius:8px; overflow:hidden; box-shadow:0 8px 24px rgba(15,23,42,.04); }
      .erp-route-page .el-table th.el-table__cell { background:#f8fafc !important; color:#7c8798; font-weight:800; }
      .erp-route-page .el-table td.el-table__cell { color:#1f2937; }
      .erp-route-page .el-tabs__header { margin:0 0 14px; }
      .erp-route-page .el-tabs__nav-wrap::after { display:none; }
      .erp-route-page .el-tabs__item { font-weight:800; color:#64748b; }
      .erp-route-page .el-tabs__item.is-active { color:#111827; }
      .erp-route-page .el-tabs__active-bar { background:#111827; height:3px; border-radius:999px; }
      .erp-route-page .el-input__wrapper,
      .erp-route-page .el-select__wrapper,
      .erp-route-page .el-textarea__inner { border-radius:8px; box-shadow:0 0 0 1px #dfe7f1 inset; }
      .erp-route-page .el-button { border-radius:8px; font-weight:700; }
      .erp-route-page .el-pagination { font-weight:700; }
      .market-discovery-auto { max-width:1760px; margin:0 auto; }
      .market-discovery-auto * { box-sizing:border-box; }
      .market-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:14px; }
      .market-title { margin:0; font-size:28px; line-height:1.18; color:#0f172a; letter-spacing:0; }
      .market-subtitle { margin-top:7px; color:#64748b; font-size:14px; line-height:1.5; }
      .market-head-actions { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; max-width:680px; }
      .market-status-strip { display:grid; grid-template-columns:minmax(280px,1.2fr) repeat(4,minmax(140px,1fr)); gap:10px; margin-bottom:14px; }
      .market-status-card { background:#fff; border:1px solid #dfe7f1; border-radius:8px; padding:14px 16px; min-width:0; }
      .market-status-label { color:#64748b; font-size:12px; font-weight:800; }
      .market-status-value { margin-top:8px; font-size:24px; line-height:1.1; font-weight:900; color:#0f172a; }
      .market-status-value small { font-size:12px; color:#64748b; font-weight:700; }
      .market-flow { background:#fff; border:1px solid #dfe7f1; border-radius:8px; padding:14px 16px; margin-bottom:14px; }
      .market-flow-head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
      .market-flow-strip { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; }
      .market-flow-step { position:relative; display:flex; gap:10px; align-items:flex-start; border:1px solid #e2e8f0; border-radius:8px; padding:10px 10px; background:#f8fafc; cursor:pointer; transition:all .15s ease; min-width:0; }
      .market-flow-step:hover { border-color:#93c5fd; box-shadow:0 2px 8px rgba(37,99,235,.12); transform:translateY(-1px); }
      .market-flow-step.active { border-color:#2563eb; background:#eff6ff; }
      .market-flow-index { flex:0 0 auto; width:26px; height:26px; border-radius:50%; line-height:26px; text-align:center; font-weight:900; color:#fff; background:#94a3b8; font-size:13px; }
      .market-flow-index.active { background:#2563eb; }
      .market-flow-index.done { background:#16a34a; }
      .market-flow-body { min-width:0; flex:1; }
      .market-flow-title { font-weight:800; color:#334155; font-size:13px; white-space:nowrap; }
      .market-flow-desc { font-size:11px; color:#94a3b8; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .market-flow-count { margin-top:5px; font-size:18px; font-weight:900; color:#0f172a; }
      .market-flow-count small { font-size:11px; color:#64748b; font-weight:700; margin-left:2px; }
      .market-flow-arrow { align-self:center; color:#cbd5e1; font-size:22px; font-weight:900; flex:0 0 auto; }
      .market-workspace { display:grid; grid-template-columns:280px minmax(0,1fr); gap:14px; align-items:start; }
      .market-filter-panel, .market-data-panel { background:#fff; border:1px solid #dfe7f1; border-radius:8px; padding:14px; min-width:0; }
      .market-filter-title { font-size:14px; font-weight:900; color:#0f172a; margin-bottom:10px; }
      .market-filter-stack { display:flex; flex-direction:column; gap:10px; }
      .market-filter-stack .el-button, .market-filter-stack .el-select, .market-filter-stack .el-input { width:100%; }
      .market-rule-chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:2px; }
      .market-data-toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; flex-wrap:wrap; }
      .market-filter-bar { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:10px; padding:10px 12px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:8px; }
      .market-filter-bar-group { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
      .market-filter-bar-group .el-select, .market-filter-bar-group .el-input { flex:0 0 auto; }
      .market-filter-bar-cat { display:flex; align-items:center; gap:6px; margin-bottom:10px; }
      .market-toolbar-meta { display:flex; align-items:center; gap:10px; flex-wrap:wrap; color:#94a3b8; font-size:12px; }
      .market-product-cell { display:flex; gap:10px; align-items:center; min-width:0; }
      .market-thumb { width:54px; height:54px; border-radius:6px; background:#f1f5f9; flex:0 0 auto; }
      .market-thumb-empty { display:flex; align-items:center; justify-content:center; color:#94a3b8; font-weight:900; }
      .market-product-main { min-width:0; }
      .market-product-title { font-weight:900; color:#1e40af; text-decoration:none; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .market-product-sub { font-size:12px; color:#94a3b8; margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .market-signal-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; font-size:12px; color:#475569; line-height:1.35; }
      .market-settings-grid { display:grid; grid-template-columns:minmax(360px,560px) minmax(420px,1fr); gap:14px; align-items:start; }
      @media(max-width:1400px) { .market-status-strip { grid-template-columns:repeat(3,minmax(0,1fr)); } .market-flow-strip { grid-template-columns:repeat(3,minmax(0,1fr)); } }
      @media(max-width:1180px) { .market-workspace, .market-settings-grid { grid-template-columns:1fr; } .market-head { flex-direction:column; } .market-head-actions { justify-content:flex-start; max-width:none; } }
      @media(max-width:760px) { .erp-route-page { padding:20px 14px; } .market-status-strip { grid-template-columns:1fr 1fr; } .market-title { font-size:24px; } }
      .erp-workbench-title { font-size:28px; line-height:1; font-weight:800; color:#111827; letter-spacing:0; margin:0 0 14px; }
      .erp-muted { color:#64748b; }
      .erp-toolbar { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap; }
      .erp-filter-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
      .erp-selection-bar { display:flex; justify-content:space-between; align-items:center; padding:12px 14px; margin-bottom:12px; background:#eff6ff; border:1px solid #bfdbfe; border-radius:8px; }
      .text-ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .paste-upload-area { border:1px dashed #dcdfe6; border-radius:6px; padding:20px; text-align:center; background:#fafafa; cursor:pointer; }
      .image-card-wrapper { position:relative; overflow:hidden; border-radius:6px; border:1px solid #ebeef5; cursor:pointer; transition:transform .2s; }
      .image-card-wrapper:hover { transform:scale(1.02); }
      .data-screen { min-height:calc(100vh - 120px); background:#10151d; color:#f5f7fa; padding:22px; box-sizing:border-box; display:flex; flex-direction:column; gap:16px; }
      .data-screen:fullscreen { min-height:100vh; padding:28px; }
      .screen-head { display:flex; align-items:center; justify-content:space-between; }
      .screen-title { font-size:22px; font-weight:700; }
      .screen-muted { color:#9da9b8; font-size:13px; }
      .screen-grid { display:grid; grid-template-columns:minmax(220px,300px) minmax(420px,1fr) minmax(300px,380px); gap:14px; flex:1; }
      .screen-panel { background:#19212c; border:1px solid #2b3746; border-radius:6px; padding:16px; min-width:0; }
      .screen-kpi { padding:18px 0; border-bottom:1px solid #2b3746; }
      .screen-kpi:last-child { border:0; }
      .screen-kpi strong { display:block; font:700 34px ui-monospace,monospace; margin-top:7px; }
      .screen-trend { height:240px; display:flex; align-items:flex-end; gap:10px; padding-top:20px; }
      .screen-bar { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:6px; }
      .screen-bar i { display:block; width:min(42px,75%); background:#2f9bff; border-radius:3px 3px 0 0; min-height:3px; }
      .screen-list { display:flex; flex-direction:column; }
      .screen-order { display:grid; grid-template-columns:1fr auto; gap:4px; padding:11px 0; border-bottom:1px solid #2b3746; }
      .screen-marquee { overflow:hidden; white-space:nowrap; color:#ff8a80; }
      .screen-marquee span { display:inline-block; padding-left:100%; animation:screen-scroll 22s linear infinite; }
      @keyframes screen-scroll { to { transform:translateX(-100%); } }
      @media(max-width:1100px) { .screen-grid { grid-template-columns:240px 1fr; } .screen-feed { grid-column:1/-1; } .data-screen { min-height:auto; } }
    </style>
  </head>
  <body>
