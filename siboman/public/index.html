<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>逐梦 ERP 专业版</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
    <style>
      body { margin: 0; background: #f8fafc; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:#111827; }
      #app { height: 100vh; }
      .layout-container { height: 100vh; }
      .el-aside { background: #031626; color: #fff; box-shadow: inset -1px 0 0 rgba(255,255,255,.06); }
      .logo { height: 64px; line-height: 64px; text-align: center; font-size: 18px; font-weight: 800; background: #08233a; color: #38bdf8; letter-spacing:0; }
      .el-menu { border-right:0 !important; }
      .el-menu-item { height:54px; font-weight:700; font-size:14px; margin:4px 10px; border-radius:8px; color:#dbeafe !important; }
      .el-menu-item:hover { background:#0f2a44 !important; color:#fff !important; }
      .el-menu-item.is-active { background:#0b7bdc !important; color:#fff !important; }
      .el-header { height:64px; padding:0 24px; }
      .erp-app-header { background:#fff; border-bottom:1px solid #e5edf6; display:flex; align-items:center; justify-content:space-between; box-shadow:0 1px 0 rgba(15,23,42,.02); }
      .erp-main { padding:0; background:#f8fafc; overflow:auto; }
      .erp-route-page { min-height:100%; padding:28px 34px; background:#f8fafc; box-sizing:border-box; }
      .erp-route-page .el-card { border:1px solid #dfe7f1; border-radius:8px; box-shadow:none; background:#fff; overflow:hidden; }
      .erp-route-page .el-card__header { padding:16px 18px; border-bottom:1px solid #e5edf6; background:#fff; }
      .erp-route-page .el-card__body { padding:18px; }
      .erp-route-page .el-table { border-radius:8px; overflow:hidden; box-shadow:0 8px 24px rgba(15,23,42,.04); }
      .erp-route-page .el-table th.el-table__cell { background:#f8fafc !important; color:#7c8798; font-weight:800; }
      .erp-route-page .el-table td.el-table__cell { color:#1f2937; }
      .erp-route-page .el-tabs__header { margin:0 0 14px; }
      .erp-route-page .el-tabs__nav-wrap::after { display:none; }
      .erp-route-page .el-tabs__item { font-weight:800; color:#64748b; }
      .erp-route-page .el-tabs__item.is-active { color:#111827; }
      .erp-route-page .el-tabs__active-bar { background:#111827; height:3px; border-radius:999px; }
      .erp-route-page .el-input__wrapper,
      .erp-route-page .el-select__wrapper,
      .erp-route-page .el-textarea__inner { border-radius:8px; box-shadow:0 0 0 1px #dfe7f1 inset; }
      .erp-route-page .el-button { border-radius:8px; font-weight:700; }
      .erp-route-page .el-pagination { font-weight:700; }
      .erp-workbench-title { font-size:28px; line-height:1; font-weight:800; color:#111827; letter-spacing:0; margin:0 0 14px; }
      .erp-muted { color:#64748b; }
      .erp-toolbar { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap; }
      .erp-filter-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
      .erp-selection-bar { display:flex; justify-content:space-between; align-items:center; padding:12px 14px; margin-bottom:12px; background:#eff6ff; border:1px solid #bfdbfe; border-radius:8px; }
      .text-ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .paste-upload-area { border:1px dashed #dcdfe6; border-radius:6px; padding:20px; text-align:center; background:#fafafa; cursor:pointer; }
      .image-card-wrapper { position:relative; overflow:hidden; border-radius:6px; border:1px solid #ebeef5; cursor:pointer; transition:transform .2s; }
      .image-card-wrapper:hover { transform:scale(1.02); }
      .data-screen { min-height:calc(100vh - 120px); background:#10151d; color:#f5f7fa; padding:22px; box-sizing:border-box; display:flex; flex-direction:column; gap:16px; }
      .data-screen:fullscreen { min-height:100vh; padding:28px; }
      .screen-head { display:flex; align-items:center; justify-content:space-between; }
      .screen-title { font-size:22px; font-weight:700; }
      .screen-muted { color:#9da9b8; font-size:13px; }
      .screen-grid { display:grid; grid-template-columns:minmax(220px,300px) minmax(420px,1fr) minmax(300px,380px); gap:14px; flex:1; }
      .screen-panel { background:#19212c; border:1px solid #2b3746; border-radius:6px; padding:16px; min-width:0; }
      .screen-kpi { padding:18px 0; border-bottom:1px solid #2b3746; }
      .screen-kpi:last-child { border:0; }
      .screen-kpi strong { display:block; font:700 34px ui-monospace,monospace; margin-top:7px; }
      .screen-trend { height:240px; display:flex; align-items:flex-end; gap:10px; padding-top:20px; }
      .screen-bar { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:6px; }
      .screen-bar i { display:block; width:min(42px,75%); background:#2f9bff; border-radius:3px 3px 0 0; min-height:3px; }
      .screen-list { display:flex; flex-direction:column; }
      .screen-order { display:grid; grid-template-columns:1fr auto; gap:4px; padding:11px 0; border-bottom:1px solid #2b3746; }
      .screen-marquee { overflow:hidden; white-space:nowrap; color:#ff8a80; }
      .screen-marquee span { display:inline-block; padding-left:100%; animation:screen-scroll 22s linear infinite; }
      @keyframes screen-scroll { to { transform:translateX(-100%); } }
      @media(max-width:1100px) { .screen-grid { grid-template-columns:240px 1fr; } .screen-feed { grid-column:1/-1; } .data-screen { min-height:auto; } }
    </style>
  </head>
  <body>
    <div id="app">
       <div style="display:flex; justify-content:center; align-items:center; height:100vh; color:#409eff;">系统全量重构中，请稍候...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    
    <!-- 基座组件 -->
    <script src="/js/components/InlineEditCell.js?v=22915"></script>
    <script src="/js/components/ShopSwitcher.js?v=22915"></script>
    <script src="/js/components/CollectionEditDrawer.js?v=22915"></script>

    <!-- 业务视图 -->
    <script src="/js/views/Dashboard.js?v=22961"></script>
    <script src="/js/views/SourcingModule.js?v=22985"></script>
    <script src="/js/views/CollectionBox.js?v=23003"></script>

    <script src="/js/views/InventoryManagement.js?v=23006"></script>
    <script src="/js/views/OrderList.js?v=22964"></script>
    <script src="/js/views/BatchUpload.js?v=23009"></script>
    <script src="/js/views/AIImageGenerator.js?v=22954"></script>
    <script src="/js/views/StoreManagement.js?v=23007"></script>
    <script src="/js/views/ListingHistory.js?v=22955"></script>
    <script src="/js/views/AnalyticsCenter.js?v=22961"></script>
    <script src="/js/views/DataScreen.js?v=22961"></script>
    <script src="/js/views/MarketDiscovery.js?v=23152"></script>

    <!-- 主逻辑 -->
    <script src="/js/main.js?v=23152" type="module"></script>
  </body>
</html>
